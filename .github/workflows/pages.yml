# Сборка игры и публикация на GitHub Pages при каждом изменении ветки main.
# Сайт раздаётся из ветки gh-pages (Settings → Pages → Deploy from a branch → gh-pages, / (root)).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Отдельный коммит без истории из папки dist; пушим через доступ, который настроил actions/checkout.
      - name: Опубликовать сборку в ветку gh-pages
        run: |
          touch dist/.nojekyll
          export GIT_INDEX_FILE="$RUNNER_TEMP/pages-index"
          git --work-tree=dist add -A
          tree=$(git write-tree)
          commit=$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree" -m "Сборка ${GITHUB_SHA::7}")
          git push -f origin "$commit:refs/heads/gh-pages"
